name: Build KernelSU+SUSFS (pdx245)

on:
  workflow_dispatch:
    inputs:
      kernelsu_commit:
        description: 'KernelSU (tiann) commit to use (empty = pinned default)'
        required: false
        default: ''
      susfs_commit:
        description: 'susfs4ksu commit to use (empty = pinned default)'
        required: false
        default: ''
      kernel_commit:
        description: 'kernel source commit (empty = auto = boot.img scm hash)'
        required: false
        default: ''
      draft_release:
        description: 'Create draft GitHub release'
        type: boolean
        required: false
        default: true
  schedule:
    - cron: '30 17 * * 0'  # Sundays 17:30 UTC (~0:30 Mon Vietnam)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # glibc >= 2.38 for kernel host tools
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc rsync cpio zip xz-utils lz4 libelf-dev zlib1g-dev \
            libssl-dev device-tree-compiler patch python3-pip

      - name: 01 - fetch stock boot.img from LineageOS API
        run: scripts/01_fetch_bootimg.sh

      - name: 02 - fetch clang + kernel-build-tools
        run: scripts/02_setup_toolchain.sh

      - name: 03 - kernel source + KernelSU + SUSFS wiring
        env:
          KERNELSU_COMMIT: ${{ inputs.kernelsu_commit }}
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
        run: scripts/03_setup_source.sh

      - name: 04 - build Image
        run: scripts/04_build_image.sh

      - name: 05 - repack boot.img
        run: scripts/05_repack_bootimg.sh

      - name: 06 - package AnyKernel3 zip
        run: scripts/06_package_ak3.sh

      - name: Collect artifacts
        run: |
          source out/env.sh
          cp out/version.txt dist/ 2>/dev/null || true
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: xm6-kernelsu-susfs
          path: |
            dist/Image
            dist/boot_Xm6.img
            dist/boot_Xm6.img.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/config
            dist/version.txt

      - name: Release
        if: github.event_name == 'schedule' || inputs.draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{{{ github.run_number }}}}
          draft: ${{ github.event_name != 'schedule' }}
          prerelease: false
          generate_release_notes: false
          body_path: dist/version.txt
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.ZIP_NAME }}.sha256
            dist/boot_Xm6.img
            dist/boot_Xm6.img.sha256
